name = "tetrisgame"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[migrations]]
tag = "v1"
new_classes = ["GameRoom"]

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Once you've deployed, your game is live at:
#   https://block-quest.<your-subdomain>.workers.dev
#
# To use a custom domain instead, add it to your Cloudflare account first,
# then uncomment and edit:
# [[routes]]
# pattern = "yourdomain.com/*"
# custom_domain = true
